version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint 8.x declares `peer typescript ">=4.8.4 <6.1.0"`, so a
      # TypeScript 7 bump makes `npm ci` fail with ERESOLVE. Drop this entry
      # once typescript-eslint ships a release that supports TypeScript 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

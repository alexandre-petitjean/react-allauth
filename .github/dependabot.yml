version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Mirror `min-release-age=7` from .npmrc.
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
    # typescript-eslint 8.x requires typescript <6.1; drop once it supports TS 7.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

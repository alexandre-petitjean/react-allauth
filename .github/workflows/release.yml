name: Release

# Publishes to npm when a version tag (e.g. v0.1.0) is pushed.
# Requires an NPM_TOKEN secret (Automation token) in the repository settings:
#   Settings > Secrets and variables > Actions > New repository secret.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish to npm (skip if the version already exists)
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "react-allauth@${version}" version > /dev/null 2>&1; then
            echo "react-allauth@${version} is already published — skipping."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

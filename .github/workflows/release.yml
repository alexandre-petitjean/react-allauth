name: Release

# Publishes to npm when a version tag (e.g. v0.1.0) is pushed.
# Auth uses npm trusted publishing (OIDC): the package on npmjs.com declares
# this repository + workflow as a trusted publisher; no token is needed.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing requires npm >= 11.5.1; Node 22 bundles npm 10.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - name: Publish to npm (skip if the version already exists)
        run: |
          version=$(node -p "require('./package.json').version")
          # Pre-releases (e.g. 1.0.0-rc.1) go to the "next" dist-tag so they
          # never become "latest" for plain `npm install`.
          case "$version" in
            *-*) dist_tag="next" ;;
            *) dist_tag="latest" ;;
          esac
          if npm view "react-allauth@${version}" version > /dev/null 2>&1; then
            echo "react-allauth@${version} is already published — skipping."
          else
            npm publish --provenance --access public --tag "$dist_tag"
          fi

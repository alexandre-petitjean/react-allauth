# Run `pre-commit install` once to enable these hooks on every commit.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx eslint --fix
        language: system
        types_or: [ts, tsx, javascript, jsx]
        require_serial: true
      - id: typecheck
        name: typecheck
        entry: npm run typecheck
        language: system
        files: \.(ts|tsx)$
        pass_filenames: false
        require_serial: true
